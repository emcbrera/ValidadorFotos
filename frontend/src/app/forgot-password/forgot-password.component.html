<section class="recovery-page">
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="recovery-container">
    <div class="recovery-card">
      <div class="recovery-header">
        <div class="logo-wrapper">
          <i class="bi bi-envelope-lock-fill logo-icon"></i>
        </div>
        <h1 class="recovery-title">Recuperar contrasena</h1>
        <p class="recovery-subtitle">Ingresa tu correo registrado y enviaremos un enlace de recuperacion.</p>
      </div>

      <div class="alert-success" *ngIf="successMessage" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        {{ successMessage }}
      </div>

      <div class="alert-error" *ngIf="errorMessage" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="correo" class="form-label">Correo electronico</label>
          <div class="input-wrapper" [class.input-error]="correoCtrl.invalid && correoCtrl.touched">
            <i class="bi bi-envelope-fill input-icon"></i>
            <input
              id="correo"
              type="email"
              class="form-control custom-input"
              formControlName="correo"
              placeholder="usuario@correo.com"
              autocomplete="email"
            />
          </div>
          <div class="error-msg" *ngIf="correoCtrl.invalid && correoCtrl.touched">
            <span *ngIf="correoCtrl.errors?.['required']">El correo es requerido</span>
            <span *ngIf="correoCtrl.errors?.['email']">Ingresa un correo valido</span>
          </div>
        </div>

        <button type="submit" class="btn-recovery" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            <i class="bi bi-send-fill me-2"></i>Enviar enlace
          </span>
          <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
            <span class="spinner"></span>Enviando...
          </span>
        </button>
      </form>

      <div class="recovery-footer">
        <a routerLink="/login" class="back-link">
          <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesion
        </a>
      </div>
    </div>
  </div>
</section>
