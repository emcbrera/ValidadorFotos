<section class="recovery-page">
  <div class="institutional-bg">
    <div class="stripe-top"></div>
    <div class="stripe-bottom"></div>
  </div>

  <div class="recovery-container">
    <div class="recovery-card">
      <div class="recovery-header">
        <div class="logo-container">
          <img src="https://www.uniajc.edu.co/wp-content/uploads/2021/03/logo-uniajc.png" alt="Logo UNIAJC"
            class="institutional-logo"
            onerror="this.style.display='none'; document.getElementById('recovery-logo-fallback').style.display='flex'">
          <div id="recovery-logo-fallback" class="logo-fallback" style="display: none;">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
        </div>
        <h2 class="institution-name">Institucion Universitaria</h2>
        <h1 class="institution-brand">Antonio Jose Camacho</h1>
        <p class="recovery-subtitle">Recuperacion de contrasena</p>
      </div>

      <div class="alert-success" *ngIf="successMessage" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        {{ successMessage }}
      </div>

      <div class="alert-error" *ngIf="errorMessage" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="correo" class="form-label">Correo electronico</label>
          <div class="input-field" [class.input-invalid]="correoCtrl.invalid && correoCtrl.touched">
            <i class="bi bi-envelope-fill"></i>
            <input
              id="correo"
              type="email"
              class="form-control-institutional"
              formControlName="correo"
              placeholder="Ingresa tu correo registrado"
              autocomplete="email"
            />
          </div>
          <div class="field-error" *ngIf="correoCtrl.invalid && correoCtrl.touched">
            <span *ngIf="correoCtrl.errors?.['required']">El correo es requerido</span>
            <span *ngIf="correoCtrl.errors?.['email']">Ingresa un correo valido</span>
          </div>
        </div>

        <button type="submit" class="btn-institutional-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            ENVIAR ENLACE DE RECUPERACION
          </span>
          <span *ngIf="isLoading" class="loader-container">
            <span class="dot-loader"></span> Enviando...
          </span>
        </button>
      </form>

      <div class="recovery-footer">
        <a routerLink="/login" class="link-secondary">Volver al inicio de sesion</a>
        <div class="footer-divider"></div>
        <p class="copyright">&copy; 2026 UNIAJC - Todos los derechos reservados</p>
      </div>
    </div>
  </div>
</section>
