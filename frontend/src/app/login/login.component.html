<section class="login-page">
  <!-- Fondo Institucional -->
  <div class="institutional-bg">
    <div class="stripe-top"></div>
    <div class="stripe-bottom"></div>
  </div>

  <div class="login-container">
    <div class="login-card">

      <!-- Header Institucional -->
      <div class="login-header">
        <div class="logo-container">
          <!-- Placeholder para el logo oficial de la UNIAJC -->
          <img src="https://www.uniajc.edu.co/wp-content/uploads/2021/03/logo-uniajc.png" alt="Logo UNIAJC"
            class="institutional-logo"
            onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex'">
          <div id="logo-fallback" class="logo-fallback" style="display: none;">
            <i class="bi bi-mortarboard-fill"></i>
          </div>
        </div>
        <h2 class="institution-name">Institución Universitaria</h2>
        <h1 class="institution-brand">Antonio José Camacho</h1>
        <p class="login-subtitle">Sistema de Validación Fotográfica</p>
      </div>

      <!-- Alerta de Error -->
      <div class="alert-error" *ngIf="showError" role="alert">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <div class="form-group">
          <label for="email" class="form-label">Usuario o Correo</label>
          <div class="input-field" [class.input-invalid]="emailCtrl.invalid && emailCtrl.touched">
            <i class="bi bi-person-bounding-box"></i>
            <input id="email" type="text" class="form-control-institutional" formControlName="email"
              placeholder="Ingresa tu identificador" autocomplete="username" />
          </div>
          <div class="field-error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
            <span *ngIf="emailCtrl.errors?.['required']">Este campo es obligatorio</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-field" [class.input-invalid]="passwordCtrl.invalid && passwordCtrl.touched">
            <i class="bi bi-key-fill"></i>
            <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-control-institutional"
              formControlName="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="btn-toggle-view" (click)="togglePassword()">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
          </div>
          <div class="field-error" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
            <span *ngIf="passwordCtrl.errors?.['required']">La contraseña es obligatoria</span>
            <span *ngIf="passwordCtrl.errors?.['minlength']">Mínimo 6 caracteres</span>
          </div>
        </div>

        <button type="submit" class="btn-institutional-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">INGRESAR AL SISTEMA</span>
          <span *ngIf="isLoading" class="loader-container">
            <span class="dot-loader"></span> Verificando...
          </span>
        </button>

      </form>

      <div class="login-footer">
        <a routerLink="/forgot-password" class="link-secondary">¿Olvidaste tu contraseña?</a>
        <div class="footer-divider"></div>
        <p class="copyright">&copy; 2026 UNIAJC - Todos los derechos reservados</p>
      </div>

    </div>
  </div>
</section>
