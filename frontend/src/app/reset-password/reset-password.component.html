<section class="reset-page">
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="reset-container">
    <div class="reset-card">
      <div class="reset-header">
        <div class="logo-wrapper">
          <i class="bi bi-shield-check logo-icon"></i>
        </div>
        <h1 class="reset-title">Nueva contrasena</h1>
        <p class="reset-subtitle">Crea una contrasena segura para volver a ingresar al sistema.</p>
      </div>

      <div class="alert-success" *ngIf="successMessage" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        {{ successMessage }}
        <div class="success-action">
          <a routerLink="/login">Ir al inicio de sesion</a>
        </div>
      </div>

      <div class="alert-error" *ngIf="errorMessage" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        {{ errorMessage }}
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="nuevaPassword" class="form-label">Nueva contrasena</label>
          <div class="input-wrapper" [class.input-error]="nuevaPasswordCtrl.invalid && nuevaPasswordCtrl.touched">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              id="nuevaPassword"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control custom-input"
              formControlName="nuevaPassword"
              placeholder="Minimo 8 caracteres"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password" (click)="togglePassword()" aria-label="Mostrar contrasena">
              <i class="bi" [class.bi-eye-fill]="!showPassword" [class.bi-eye-slash-fill]="showPassword"></i>
            </button>
          </div>
          <div class="error-msg" *ngIf="nuevaPasswordCtrl.invalid && nuevaPasswordCtrl.touched">
            <span *ngIf="nuevaPasswordCtrl.errors?.['required']">La nueva contrasena es requerida</span>
            <span *ngIf="nuevaPasswordCtrl.errors?.['minlength']">Minimo 8 caracteres</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmarPassword" class="form-label">Confirmar contrasena</label>
          <div class="input-wrapper" [class.input-error]="confirmarPasswordCtrl.touched && (confirmarPasswordCtrl.invalid || resetForm.errors?.['passwordsMismatch'])">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              id="confirmarPassword"
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-control custom-input"
              formControlName="confirmarPassword"
              placeholder="Repite la contrasena"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password" (click)="toggleConfirmPassword()" aria-label="Mostrar confirmacion">
              <i class="bi" [class.bi-eye-fill]="!showConfirmPassword" [class.bi-eye-slash-fill]="showConfirmPassword"></i>
            </button>
          </div>
          <div class="error-msg" *ngIf="confirmarPasswordCtrl.touched">
            <span *ngIf="confirmarPasswordCtrl.errors?.['required']">Confirma la nueva contrasena</span>
            <span *ngIf="resetForm.errors?.['passwordsMismatch']">Las contrasenas no coinciden</span>
          </div>
        </div>

        <button type="submit" class="btn-reset" [disabled]="isLoading || resetForm.disabled">
          <span *ngIf="!isLoading">
            <i class="bi bi-check2-circle me-2"></i>Restablecer contrasena
          </span>
          <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
            <span class="spinner"></span>Guardando...
          </span>
        </button>
      </form>

      <div class="reset-footer">
        <a routerLink="/login" class="back-link">
          <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesion
        </a>
      </div>
    </div>
  </div>
</section>
