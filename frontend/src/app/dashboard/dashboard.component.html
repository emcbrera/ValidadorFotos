<section class="dashboard-page">
  <div class="bg-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="dashboard-content" *ngIf="user">
    <!-- Navbar -->
    <nav class="dashboard-nav">
      <div class="nav-brand">
        <i class="bi bi-shield-lock-fill"></i>
        <span>Mi App</span>
      </div>
      <div class="nav-actions">
        <span class="nav-time">{{ currentTime | date:'HH:mm:ss' }}</span>
        <button id="btn-logout" class="btn-logout" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
        </button>
      </div>
    </nav>

    <!-- Hero card -->
    <div class="hero-card">
      <div class="avatar">
        <i class="bi bi-person-fill"></i>
      </div>
      <div class="welcome-text">
        <h1>¡Bienvenido, {{ user.name }}!</h1>
        <p>Has iniciado sesión como <span class="badge-role">{{ user.role }}</span></p>
        <p class="email-tag"><i class="bi bi-envelope-fill me-1"></i>{{ user.email }}</p>
      </div>
    </div>

    <!-- Stats cards placeholder -->
    <div class="stats-grid">
      <div class="stat-card">
        <i class="bi bi-people-fill stat-icon"></i>
        <div>
          <div class="stat-value">1,284</div>
          <div class="stat-label">Usuarios activos</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="bi bi-graph-up stat-icon"></i>
        <div>
          <div class="stat-value">98.4%</div>
          <div class="stat-label">Uptime del sistema</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="bi bi-check2-circle stat-icon"></i>
        <div>
          <div class="stat-value">49</div>
          <div class="stat-label">Tareas completadas</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="bi bi-bell-fill stat-icon"></i>
        <div>
          <div class="stat-value">3</div>
          <div class="stat-label">Notificaciones</div>
        </div>
      </div>
    </div>

    <!-- Coming soon banner -->
    <div class="coming-soon">
      <i class="bi bi-tools me-2"></i>
      El contenido del dashboard se conectará al backend próximamente.
    </div>
  </div>
</section>
